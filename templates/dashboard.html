<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojex PRO | Dashboard</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 250px; background-color: #1e293b; height: 100vh; padding: 20px; box-sizing: border-box; }
        .sidebar h2 { color: #eab308; text-align: center; margin-bottom: 40px; }
        .sidebar a { display: block; color: white; text-decoration: none; padding: 12px; margin: 10px 0; background: #334155; border-radius: 6px; text-align: center; font-weight: bold; }
        .sidebar a:hover { background: #eab308; color: black; }
        .main-content { flex-grow: 1; padding: 40px; }
        .grid { display: flex; gap: 20px; margin-top: 30px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; width: 50%; text-align: center; border: 1px solid #334155; transition: 0.3s; }
        .card:hover { border-color: #eab308; transform: translateY(-5px); }
        .card h3 { color: #eab308; font-size: 22px; }
        .btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background: #eab308; color: black; text-decoration: none; font-weight: bold; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>⚡ Gojex PRO</h2>
        <a href="/dashboard">🏠 Dashboard</a>
        <a href="/logout" style="background: #dc2626; margin-top: 50px;">🚪 Logout</a>
    </div>
    <div class="main-content">
        <h1>Welcome Back, Zenitsu.</h1>
        <p>Select your upload mode to dominate the feed.</p>
        <div class="grid">
            <div class="card">
                <h3>📤 Manual Upload</h3>
                <p>Upload a single reel instantly.</p>
                <a href="#" class="btn">Start Manual</a>
            </div>
            <div class="card">
                <h3>📁 Batch Templates</h3>
                <p>Manage your 15-reel cloud vault.</p>
                <a href="#" class="btn">Manage Templates</a>
            </div>
        </div>
    </div>
</body>
</html>
