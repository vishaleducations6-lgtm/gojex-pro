<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gojex PRO | Vault Gallery</title>
    <style>
        body { background: #0f172a; color: white; font-family: Arial; padding: 30px; }
        .header { text-align: center; margin-bottom: 40px; }
        .upload-box { background: #1e293b; padding: 20px; border-radius: 12px; text-align: center; border: 1px dashed #eab308; max-width: 500px; margin: 0 auto 40px auto; }
        input, textarea { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; background: #334155; color: white; font-family: Arial;}
        .btn { background: #eab308; padding: 10px 20px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: black; }
        .btn:hover { background: #ca8a04; }
        
        /* VIP Gallery Grid */
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .reel-card { background: #1e293b; border-radius: 10px; padding: 15px; border: 1px solid #334155; }
        .reel-card video { width: 100%; border-radius: 8px; background: #000; height: 350px; object-fit: cover;}
        .caption-text { font-size: 14px; color: #cbd5e1; margin: 10px 0; height: 40px; overflow: hidden; }
        .post-btn { width: 100%; background: #22c55e; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .post-btn:hover { background: #16a34a; }
    </style>
</head>
<body>

    <div class="header">
        <h1 style="color: #eab308;">📁 Batch Templates Gallery</h1>
        <a href="/dashboard" style="color: #94a3b8; text-decoration: none;">🔙 Back to Dashboard</a>
    </div>

    <!-- Upload Section -->
    <div class="upload-box">
        <h3>➕ Add New Template</h3>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="reel_video" accept="video/mp4" required>
            <textarea name="caption" rows="3" placeholder="Write caption & hashtags here..."></textarea>
            <button type="submit" class="btn">☁️ Upload to Vault</button>
        </form>
    </div>

    <!-- Gallery Section -->
    <h2 style="border-bottom: 2px solid #334155; padding-bottom: 10px;">Pending Templates ({{ reels|length }})</h2>
    
    <div class="gallery">
        {% for reel in reels %}
        <div class="reel-card">
            <video src="{{ reel.video_url }}" controls></video>
            <p class="caption-text">{{ reel.caption }}</p>
            <button class="post-btn">🚀 Post to Instagram</button>
        </div>
        {% else %}
        <p style="color: #94a3b8;">No reels in your vault yet. Upload some templates above!</p>
        {% endfor %}
    </div>

</body>
</html>
