<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gojex Pro | Login</title>
    <style>
        body { background-color: #0f172a; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 6px; border: none; background: #334155; color: white; }
        button { width: 95%; padding: 10px; margin-top: 15px; border-radius: 6px; border: none; background: #eab308; color: black; font-weight: bold; cursor: pointer; }
        button:hover { background: #ca8a04; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>⚡ Gojex PRO</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
    </div>
</body>
</html>
